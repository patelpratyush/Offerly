name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The test container must match @playwright/test exactly; read it from the
  # lockfile so dependency bumps pick the right image automatically.
  playwright-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: lock
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
  verify:
    needs: playwright-version
    runs-on: ubuntu-24.04
    # Browsers and their system libraries come preinstalled, so CI never waits on
    # Ubuntu mirrors or the Playwright CDN (both hung installs in Nov 2026).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: offerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-password@postgres:5432/offerly_test
      - run: npm run build
      - run: node scripts/audit.js
      - run: npm run test:e2e
        env:
          CI: 'true'
      - run: npm run test:devices
        env:
          CI: 'true'
